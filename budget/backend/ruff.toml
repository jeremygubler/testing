# Ruff ersetzt Flake8 + isort + Black in einem Werkzeug.
line-length = 100
target-version = "py311"

exclude = [".venv", "alembic/versions", "data"]

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-eigene Regeln
]
ignore = [
    # Deutsche Kommentare und Fehlertexte enthalten Umlaute; RUF001/2/3 meldet die
    # als "ambiguous unicode" -- hier ist das keine Verwechslungsgefahr, sondern Sprache.
    "RUF001",
    "RUF002",
    "RUF003",
    # B008: FastAPI-Abhaengigkeiten stehen per Konvention im Default-Argument.
    "B008",
]

[lint.per-file-ignores]
"tests/*" = ["E501"]

[format]
quote-style = "double"
