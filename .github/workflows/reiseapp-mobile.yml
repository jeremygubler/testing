name: reiseapp mobile

on:
  push:
    paths:
      - "reiseapp/mobile/**"
      - ".github/workflows/reiseapp-mobile.yml"
  pull_request:
    paths:
      - "reiseapp/mobile/**"
      - ".github/workflows/reiseapp-mobile.yml"

defaults:
  run:
    working-directory: reiseapp/mobile

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reiseapp/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Bundling with Metro is the cheapest way to prove that every import
      # resolves and the expo-router graph is valid, without a native build.
      - name: Bundle (Metro smoke test)
        run: npx expo export --platform android --output-dir /tmp/expo-export
