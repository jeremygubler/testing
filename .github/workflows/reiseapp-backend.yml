name: reiseapp backend

on:
  push:
    paths:
      - "reiseapp/backend/**"
      - ".github/workflows/reiseapp-backend.yml"
  pull_request:
    paths:
      - "reiseapp/backend/**"
      - ".github/workflows/reiseapp-backend.yml"

defaults:
  run:
    working-directory: reiseapp/backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: reiseapp
          POSTGRES_PASSWORD: reiseapp
          POSTGRES_DB: reiseapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reiseapp -d reiseapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      REISEAPP_ENV: test
      REISEAPP_JWT_SECRET: ci-secret
      REISEAPP_DATABASE_URL: postgresql+asyncpg://reiseapp:reiseapp@localhost:5432/reiseapp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reiseapp/backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests alembic

      - name: Typecheck
        run: mypy app

      - name: Unit tests
        run: pytest -q -m "not integration"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration matches models (no drift)
        run: alembic check

      - name: Integration tests (PostGIS)
        run: pytest -q -m integration

      - name: Migrations are reversible
        run: alembic downgrade base
