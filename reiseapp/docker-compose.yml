name: reiseapp

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reiseapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-reiseapp}
      # Keeps index/collation behaviour stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reiseapp} -d ${POSTGRES_DB:-reiseapp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the media bucket and keeps it private (objects are served
  # through the backend via presigned URLs, never anonymously).
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-reiseapp-media} &&
      mc anonymous set none local/${S3_BUCKET:-reiseapp-media}
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-runtime}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      REISEAPP_ENV: ${REISEAPP_ENV:-production}
      REISEAPP_LOG_LEVEL: ${REISEAPP_LOG_LEVEL:-info}
      REISEAPP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reiseapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reiseapp}
      REISEAPP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REISEAPP_ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REISEAPP_REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REISEAPP_S3_ENDPOINT_URL: http://minio:9000
      REISEAPP_S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      REISEAPP_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      REISEAPP_S3_SECRET_KEY: ${S3_SECRET_KEY}
      REISEAPP_S3_BUCKET: ${S3_BUCKET:-reiseapp-media}
      REISEAPP_S3_REGION: ${S3_REGION:-us-east-1}
      REISEAPP_CORS_ORIGINS: ${CORS_ORIGINS:-}
      REISEAPP_RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  minio_data:
