<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Triforce Quest — Mario × Zelda × Pokémon</title>
<style>
  :root { --bg:#0b1020; --panel:#161c33; --ink:#e8ecff; --accent:#ffcc33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(1200px 800px at 50% -10%, #1a2247, #070a16);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 12px;
  }
  h1 { margin: 0; font-size: 19px; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  #wrap { position: relative; }
  canvas {
    background: #16351f; image-rendering: pixelated;
    border: 4px solid #2b3560; border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    max-width: 96vw; height: auto; touch-action: none;
  }
  #hint { font-size: 12.5px; color: #9aa6d6; text-align: center; max-width: 660px; line-height: 1.5; }
  kbd { background: var(--panel); border: 1px solid #333c66; border-bottom-width: 3px;
        border-radius: 4px; padding: 1px 6px; font-size: 12px; color: var(--ink); }
  /* Touch-Steuerung */
  #touch { display: none; width: 100%; max-width: 512px; margin-top: 6px;
           justify-content: space-between; align-items: center; user-select: none; }
  #touch.on { display: flex; }
  .pad { display: grid; grid-template-columns: repeat(3,52px); grid-template-rows: repeat(3,52px); gap: 4px; }
  .btn { background: var(--panel); border: 1px solid #333c66; border-bottom-width: 4px;
         border-radius: 10px; color: var(--ink); font-size: 22px; display: flex;
         align-items: center; justify-content: center; touch-action: none; }
  .btn:active { background: #24305c; transform: translateY(2px); }
  .acts { display: flex; gap: 12px; }
  .abtn { width: 66px; height: 66px; border-radius: 50%; font-size: 15px; font-weight: bold; }
</style>
</head>
<body>
  <h1><span>◆</span> Triforce Quest <span>◆</span></h1>
  <div id="wrap"><canvas id="game" width="512" height="480"></canvas></div>
  <div id="hint">
    <kbd>← ↑ → ↓</kbd>/<kbd>WASD</kbd> bewegen • <kbd>Leer</kbd>/<kbd>J</kbd> Schwert / A •
    <kbd>Enter</kbd> reden/bestätigen / B • <kbd>P</kbd> Pokédex • <kbd>M</kbd> Musik<br>
    Finde die <b style="color:#ffcc33">3 Triforce-Splitter</b>, rüste dich im
    <b style="color:#8be37a">Shop</b>, fang Kreaturen mit <b>Attacken & Typen</b> und stell dich dem <b style="color:#7b5cff">Boss</b> (der Golem in den Ruinen ist optional)!
  </div>
  <div id="touch">
    <div class="pad">
      <div></div><div class="btn" data-k="up">▲</div><div></div>
      <div class="btn" data-k="left">◀</div><div></div><div class="btn" data-k="right">▶</div>
      <div></div><div class="btn" data-k="down">▼</div><div></div>
    </div>
    <div class="acts">
      <div class="btn abtn" data-k="b">B</div>
      <div class="btn abtn" data-k="a">A</div>
    </div>
  </div>

<script>
"use strict";
/* ===========================================================================
   TRIFORCE QUEST  —  Mario × Zelda × Pokémon  (eine Datei, reines Canvas)
   • Zelda   : verbundene Overworld-Räume, Schwert, Herzen, Truhen, Boss
   • Mario   : Münzen, zerschlagbare Blöcke, Shop-Ökonomie
   • Pokémon : Gras-Zufallskämpfe, Typen, XP/Level, Fangen mit Bällen
=========================================================================== */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const TILE = 32, COLS = 16, ROWS = 15;

/* ---- Tiles ---- */
const T = { GRASS:0, WALL:1, TALL:2, WATER:3, BRICK:4, COIN:5, CHEST:6, PATH:8,
            SHARD:9, SHOP:10, GATE:11, SIGN:12, FLOOR:13, TREE:14, HEAL:15 };
const SOLID = new Set([T.WALL, T.WATER, T.BRICK, T.SHOP, T.GATE, T.SIGN, T.TREE, T.HEAL]);

/* ---- Kreaturen ---- */
const SPECIES = [
  { name:"Glutwelpe",  color:"#ff7a3c", emoji:"🔥", type:"fire",  hp:22, atk:6, rare:false,
    moves:[{name:"Kratzer",power:6,type:"normal"},{name:"Glut",power:9,type:"fire",effect:"burn",chance:0.3}] },
  { name:"Aquamolch",  color:"#3ca0ff", emoji:"💧", type:"water", hp:26, atk:5, rare:false,
    moves:[{name:"Aquaknarre",power:9,type:"water"},{name:"Strudel",power:6,type:"water",effect:"sleep",chance:0.35}] },
  { name:"Blattbold",  color:"#5fd06b", emoji:"🌿", type:"grass", hp:24, atk:5, rare:false,
    moves:[{name:"Rankenhieb",power:9,type:"grass"},{name:"Schlafspore",power:0,type:"grass",effect:"sleep",chance:0.7}] },
  { name:"Steinknorz", color:"#b08a5a", emoji:"🪨", type:"rock",  hp:30, atk:4, rare:false,
    moves:[{name:"Steinwurf",power:8,type:"rock"},{name:"Panzerstoß",power:11,type:"rock"}] },
  { name:"Blitzfluse", color:"#ffd23c", emoji:"⚡", type:"elec",  hp:20, atk:7, rare:false,
    moves:[{name:"Funke",power:9,type:"elec"},{name:"Donnerschlag",power:12,type:"elec",effect:"sleep",chance:0.2}] },
  { name:"Frostgeist", color:"#9be0ff", emoji:"❄️", type:"water", hp:34, atk:8, rare:true,
    moves:[{name:"Eissturm",power:13,type:"water"},{name:"Frostbiss",power:9,type:"water",effect:"sleep",chance:0.4}] },
  { name:"Inferndrache",color:"#ff5a2c", emoji:"🐉", type:"fire", hp:36, atk:9, rare:true,
    moves:[{name:"Drachenzorn",power:13,type:"fire"},{name:"Feuersturm",power:10,type:"fire",effect:"burn",chance:0.5}] },
];
const STRONG = { fire:"grass", grass:"water", water:"fire" }; // Schere-Stein-Papier
function effectiveness(atkType, defType){
  if (STRONG[atkType] === defType) return 1.5;
  if (STRONG[defType] === atkType) return 0.66;
  return 1;
}
function makeCreature(specIdx, level){
  const s = SPECIES[specIdx];
  const lv = level || (1 + (Math.random()*4|0));
  const maxHp = s.hp + lv*3;
  return { spec:specIdx, name:s.name, color:s.color, emoji:s.emoji, type:s.type, moves:s.moves,
           level:lv, maxHp, hp:maxHp, atk:s.atk + lv, xp:0, status:null, statusTurns:0 };
}
/* Pokédex-Tracking */
function markSeen(sp){ if (sp>=0 && sp<SPECIES.length && !player.seen.includes(sp)) player.seen.push(sp); }
function markCaught(sp){ markSeen(sp); if (sp>=0 && sp<SPECIES.length && !player.caught.includes(sp)) player.caught.push(sp); }

/* ---- Spieler ---- */
const player = {
  room:"village", px:2, py:7, x:2*TILE+3, y:7*TILE+3, w:TILE-6, h:TILE-6,
  moving:false, mx:0, my:0, dir:"down", speed:4,
  maxHp:3, hp:3, coins:0, balls:3, potions:1, shards:0,
  attack:0, invuln:0, party:[], walkFrame:0, seen:[], caught:[],
};
let gtick=0, fadeT=0, pEdge=false;

/* =========================================================================
   WELT — mehrere Räume, programmatisch gebaut (weniger Tippfehler)
========================================================================= */
let rooms = {};
function blankRoom(fill){
  const t = [];
  for (let r=0;r<ROWS;r++){ const row=[]; for(let c=0;c<COLS;c++){
    row.push((r===0||r===ROWS-1||c===0||c===COLS-1) ? T.WALL : fill);
  } t.push(row); }
  return t;
}
function carve(t, exits){
  if (exits.east)  t[7][COLS-1] = T.PATH;
  if (exits.west)  t[7][0]      = T.PATH;
  if (exits.north) t[0][7]      = T.PATH;
  if (exits.south) t[ROWS-1][7] = T.PATH;
}
function buildAllRooms(){
  rooms = {};
  const set = (t,c,r,v)=>{ t[r][c]=v; };

  /* --- Dorf: Shop, Schild, Boss-Tor --- */
  {
    const exits = { east:"grass", south:"forest" };
    const t = blankRoom(T.GRASS); carve(t, exits);
    set(t,3,3,T.SHOP); set(t,5,5,T.SIGN); set(t,7,1,T.GATE); set(t,12,5,T.HEAL);
    set(t,10,3,T.COIN); set(t,11,9,T.COIN); set(t,4,10,T.COIN);
    set(t,2,2,T.TREE); set(t,13,2,T.TREE); set(t,13,11,T.TREE);
    rooms.village = { tiles:t, exits, enemies:[], npcs:[
      { c:10, r:7, color:"#7b5cff", name:"Professor", action:"dex",
        lines:["🔬 »Ich erforsche die Kreaturen!","Sprich mich an oder drück P,","um deinen Pokédex zu öffnen.«"] },
      { c:6, r:9, color:"#e0b0ff", name:"Älteste",
        lines:["👵 »Der Schattenkönig stahl das Licht.","Nur wer die 3 Splitter vereint,","kann sein Tor öffnen und ihn bezwingen.«"] },
    ] };
  }
  /* --- Graswiese: hohes Gras (Kämpfe) + Splitter 1 --- */
  {
    const exits = { west:"village", south:"cave" };
    const t = blankRoom(T.GRASS); carve(t, exits);
    for (let r=2;r<=6;r++) for (let c=9;c<=13;c++) set(t,c,r,T.TALL);
    set(t,11,3,T.SHARD);                 // Splitter im Gras
    set(t,3,3,T.COIN); set(t,3,10,T.COIN); set(t,6,11,T.COIN);
    rooms.grass = { tiles:t, exits, enemies:[
      { x:5*TILE, y:9*TILE, dir:1, hp:2, maxHp:2, alive:true, cool:0, flash:0 },
    ] };
  }
  /* --- Wald: Blöcke verbergen Splitter 2 + Gegner --- */
  {
    const exits = { north:"village", east:"cave" };
    const t = blankRoom(T.GRASS); carve(t, exits);
    [[2,3],[3,3],[4,3],[11,4],[12,4],[3,9],[4,9],[12,10]].forEach(p=>set(t,p[0],p[1],T.TREE));
    // Ziegel-Tresor um den Splitter (aufbrechen mit Schwert!)
    set(t,8,8,T.SHARD);
    [[7,8],[9,8],[8,7],[8,9]].forEach(p=>set(t,p[0],p[1],T.BRICK));
    set(t,2,11,T.COIN); set(t,13,7,T.COIN);
    rooms.forest = { tiles:t, exits, enemies:[
      { x:6*TILE, y:5*TILE, dir:1, hp:2, maxHp:2, alive:true, cool:0, flash:0 },
      { x:10*TILE, y:11*TILE, dir:-1, hp:2, maxHp:2, alive:true, cool:0, flash:0 },
    ] };
  }
  /* --- Höhle: Wasser, Gegner, Splitter 3 (Ost → Ruinen) --- */
  {
    const exits = { north:"grass", west:"forest", east:"ruins" };
    const t = blankRoom(T.FLOOR); carve(t, exits);
    for (let r=5;r<=8;r++) for (let c=6;c<=9;c++) set(t,c,r,T.WATER);
    set(t,13,2,T.SHARD);
    set(t,2,12,T.CHEST); set(t,3,3,T.COIN); set(t,12,12,T.COIN);
    rooms.cave = { tiles:t, exits, enemies:[
      { x:4*TILE, y:3*TILE, dir:1, hp:3, maxHp:3, alive:true, cool:0, flash:0 },
      { x:11*TILE, y:9*TILE, dir:-1, hp:3, maxHp:3, alive:true, cool:0, flash:0 },
    ] };
  }
  /* --- Ruinen: Golem-Miniboss + Schatz (optional) --- */
  {
    const exits = { west:"cave" };
    const t = blankRoom(T.FLOOR); carve(t, exits);
    [[3,3],[12,3],[3,11],[12,11]].forEach(p=>set(t,p[0],p[1],T.WALL));   // Säulen
    set(t,2,12,T.COIN); set(t,13,12,T.COIN);
    rooms.ruins = { tiles:t, exits, enemies:[], cleared:false, npcs:[
      { c:8, r:5, color:"#8a7a5a", name:"Golem", action:"golem", lines:[] },
    ] };
  }
  /* --- Boss-Arena --- */
  {
    const t = blankRoom(T.FLOOR);
    for (let c=1;c<COLS-1;c++){ t[1][c]=T.WALL; }
    rooms.boss = { tiles:t, exits:{}, enemies:[] };
  }
}

function getRoom(){ return rooms[player.room]; }
function tileAt(c,r){
  if (r<0||r>=ROWS||c<0||c>=COLS) return T.WALL;
  return getRoom().tiles[r][c];
}
function npcAt(c,r){ const ns=getRoom().npcs; return ns ? (ns.find(n=>n.c===c&&n.r===r)||null) : null; }
function isSolid(c,r){ return SOLID.has(tileAt(c,r)) || !!npcAt(c,r); }

/* =========================================================================
   ZUSTAND / DIALOGE
========================================================================= */
let state = "title";          // title|overworld|battle|message|shop|gameover|victory
let message = null, battle = null, shop = null;
let hasSave = false;

function showMessage(lines, after){
  message = { lines: Array.isArray(lines)?lines:[lines], after: after||null };
  state = "message";
}

/* =========================================================================
   EINGABE
========================================================================= */
const keys = {};
let enterEdge=false, attackEdge=false;
function press(k){
  if (!keys[k]){
    if (k==="enter"||k==="b") enterEdge=true;
    if (k===" "||k==="j"||k==="a") attackEdge=true;
    if (k==="p") pEdge=true;
  }
  if (k==="m") musicOn=!musicOn;
  keys[k]=true;
  initAudio();
}
function release(k){ keys[k]=false; }
addEventListener("keydown", e=>{
  const k=e.key.toLowerCase();
  if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();
  press(k);
});
addEventListener("keyup", e=> release(e.key.toLowerCase()));

/* Touch: DOM-Buttons auf key-Flags mappen */
const touchMap = { up:"arrowup", down:"arrowdown", left:"arrowleft", right:"arrowright", a:"a", b:"enter" };
(function initTouch(){
  const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
  const bar = document.getElementById("touch");
  if (isTouch) bar.classList.add("on");
  document.querySelectorAll("#touch .btn").forEach(el=>{
    const key = touchMap[el.dataset.k];
    const down = e=>{ e.preventDefault(); press(key); };
    const up   = e=>{ e.preventDefault(); release(key); };
    el.addEventListener("touchstart", down, {passive:false});
    el.addEventListener("touchend", up, {passive:false});
    el.addEventListener("touchcancel", up, {passive:false});
    el.addEventListener("mousedown", down);
    el.addEventListener("mouseup", up);
    el.addEventListener("mouseleave", up);
  });
})();

/* =========================================================================
   AUDIO (WebAudio-Beeps, keine Dateien)
========================================================================= */
let actx = null;
function initAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type, vol){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"square"; o.frequency.value=freq;
  g.gain.value=vol||0.06;
  o.connect(g); g.connect(actx.destination);
  const now=actx.currentTime;
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now+(dur||0.1));
  o.start(now); o.stop(now+(dur||0.1));
}
const sfx = {
  coin:()=>{ beep(988,0.06,"square"); setTimeout(()=>beep(1319,0.08,"square"),60); },
  sword:()=>beep(220,0.07,"sawtooth",0.05),
  hit:()=>beep(140,0.09,"square",0.07),
  hurt:()=>beep(90,0.18,"sawtooth",0.08),
  select:()=>beep(660,0.04,"square",0.04),
  levelup:()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.1,"triangle",0.06),i*80)); },
  catch:()=>{ [660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.1,"square",0.06),i*90)); },
  win:()=>{ [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.15,"triangle",0.07),i*140)); },
};

/* ---- Hintergrundmusik (Chiptune-Loop auf 8tel-Raster) ---- */
let musicOn=true, musicIdx=0;
const TRACKS = {
  explore:[330,0,392,0,440,392,330,0, 294,0,330,262,0,294,0,0],
  battle :[440,440,0,392,392,0,349,0, 330,392,440,494,523,0,494,0],
  title  :[523,0,659,0,784,0,659,523, 587,0,659,0,523,0,0,0],
};
function currentTrack(){ return state==="battle"?"battle":(state==="title"||state==="victory")?"title":"explore"; }
setInterval(()=>{
  if (!actx || !musicOn) return;
  const seq=TRACKS[currentTrack()]; const f=seq[musicIdx%seq.length]; musicIdx++;
  if (f) beep(f, 0.16, "triangle", 0.022);
}, 195);

/* =========================================================================
   EFFEKTE — Partikel, Floater, Screenshake
========================================================================= */
let particles=[], floaters=[], shakeT=0, shakeMag=0;
function spawnParticles(x,y,color,n){
  for(let i=0;i<(n||6);i++) particles.push({
    x,y, vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3-1,
    life:18+Math.random()*10, color });
}
function floater(text,x,y,color){ floaters.push({text,x,y,color:color||"#fff",life:55}); }
function shake(frames,mag){ shakeT=Math.max(shakeT,frames); shakeMag=mag||4; }

/* =========================================================================
   OVERWORLD
========================================================================= */
function dirToCompass(d){ return {left:"west",right:"east",up:"north",down:"south"}[d]; }
function facingTile(){
  const d={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]}[player.dir];
  return { c: player.px+d[0], r: player.py+d[1] };
}

function tryStartMove(dx,dy,dir){
  player.dir=dir;
  if (player.moving) return;
  const nc=player.px+dx, nr=player.py+dy;
  if (nc<0||nc>=COLS||nr<0||nr>=ROWS){        // Raumwechsel?
    const ex=getRoom().exits[dirToCompass(dir)];
    if (ex) doTransition(ex, dir);
    return;
  }
  if (isSolid(nc,nr)) return;
  player.moving=true; player.mx=dx; player.my=dy;
}
function doTransition(roomKey, dir){
  fadeT=14;
  player.room=roomKey; player.moving=false;
  if (dir==="right"){ player.px=0;      player.py=7; }
  if (dir==="left"){  player.px=COLS-1; player.py=7; }
  if (dir==="up"){    player.px=7;      player.py=ROWS-1; }
  if (dir==="down"){  player.px=7;      player.py=0; }
  player.x=player.px*TILE+3; player.y=player.py*TILE+3;
  saveGame();
}

function handleNpc(n){
  if (n.action==="dex"){ openDex(); return; }
  if (n.action==="golem"){
    if (getRoom().cleared) showMessage(["🗿 Der Golem ruht nun friedlich.","»Dein Schatz war verdient, Held.«"]);
    else startMiniBoss();
    return;
  }
  showMessage(n.lines);
}
function interact(){                            // Enter/B im Overworld
  const f=facingTile(); const npc=npcAt(f.c,f.r);
  if (npc){ handleNpc(npc); return; }
  const t=tileAt(f.c,f.r);
  if (t===T.SHOP) openShop();
  else if (t===T.HEAL){
    player.party.forEach(c=>{ c.hp=c.maxHp; }); player.hp=player.maxHp;
    sfx.levelup(); showMessage(["💚 Die Heil-Statue leuchtet auf...","Dein Team und deine Herzen sind voll!"]); saveGame();
  }
  else if (t===T.SIGN) showMessage(["📜 »Wanderer! Sammle die 3 Triforce-",
                                     "Splitter in Wiese, Wald und Höhle.",
                                     "Dann öffnet sich das Tor zum Boss.«"]);
  else if (t===T.GATE){
    if (player.shards>=3){ showMessage(["Das Tor erkennt die 3 Splitter...",
                                        "Es öffnet sich! Der Boss erwartet dich."],
                                        ()=>enterBoss()); }
    else showMessage(["Das Tor ist versiegelt.",
                      "Splitter: "+player.shards+" / 3"]);
  }
}

function updateOverworld(){
  if (player.invuln>0) player.invuln--;

  if (attackEdge && player.attack<=0){ player.attack=14; sfx.sword(); }
  if (player.attack>0){ player.attack--; resolveSword(); }
  if (enterEdge) interact();
  if (pEdge) openDex();

  if (!player.moving){
    if (keys["arrowleft"]||keys["a"])       tryStartMove(-1,0,"left");
    else if (keys["arrowright"]||keys["d"]) tryStartMove(1,0,"right");
    else if (keys["arrowup"]||keys["w"])    tryStartMove(0,-1,"up");
    else if (keys["arrowdown"]||keys["s"])  tryStartMove(0,1,"down");
  }
  if (player.moving){
    player.walkFrame++;
    const tx=(player.px+player.mx)*TILE+3, ty=(player.py+player.my)*TILE+3;
    player.x+=Math.sign(tx-player.x)*player.speed;
    player.y+=Math.sign(ty-player.y)*player.speed;
    if (Math.abs(tx-player.x)<player.speed && Math.abs(ty-player.y)<player.speed){
      player.x=tx; player.y=ty; player.px+=player.mx; player.py+=player.my;
      player.moving=false; onEnterTile(player.px,player.py);
    }
  } else player.walkFrame=0;

  updateEnemies();
}

function onEnterTile(c,r){
  const room=getRoom(); const t=room.tiles[r][c];
  if (t===T.COIN){ room.tiles[r][c]=baseFloor(); player.coins++; sfx.coin();
    floater("+1¢", c*TILE+8, r*TILE, "#ffcc33"); spawnParticles(c*TILE+16,r*TILE+16,"#ffcc33",5); saveGame(); }
  else if (t===T.SHARD){ room.tiles[r][c]=baseFloor(); player.shards++; sfx.win();
    spawnParticles(c*TILE+16,r*TILE+16,"#ffe066",14); shake(14,3);
    showMessage(["✦ Triforce-Splitter gefunden! ✦","Splitter: "+player.shards+" / 3"]); saveGame(); }
  else if (t===T.CHEST){ room.tiles[r][c]=baseFloor(); player.maxHp++; player.hp=player.maxHp;
    player.coins+=5; sfx.coin(); saveGame();
    showMessage(["Du öffnest eine Truhe!","❤ Max-Herzen +1 (voll geheilt)","¢ +5 Münzen"]); }
  else if (t===T.TALL){ if (Math.random()<0.28) startBattle(); }
}
function baseFloor(){ return (player.room==="cave"||player.room==="boss"||player.room==="ruins") ? T.FLOOR : T.GRASS; }

/* Schwert */
function swordHitBox(){
  const cx=player.x+player.w/2, cy=player.y+player.h/2, reach=TILE;
  let bx=cx-reach/2, by=cy-reach/2, bw=reach, bh=reach;
  if (player.dir==="left")  bx=player.x-reach;
  if (player.dir==="right") bx=player.x+player.w;
  if (player.dir==="up")    by=player.y-reach;
  if (player.dir==="down")  by=player.y+player.h;
  return {x:bx,y:by,w:bw,h:bh};
}
function rects(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function resolveSword(){
  if (player.attack!==13) return;             // nur erster aktiver Frame
  const hb=swordHitBox(), room=getRoom();
  room.enemies.forEach(en=>{
    if (!en.alive) return;
    if (rects(hb,{x:en.x+4,y:en.y+4,w:TILE-8,h:TILE-8})){
      en.hp--; en.flash=8; sfx.hit(); shake(6,3);
      spawnParticles(en.x+16,en.y+16,"#ff9",6);
      if (en.hp<=0){ en.alive=false; player.coins+=2;
        floater("+2¢", en.x, en.y, "#ff9"); spawnParticles(en.x+16,en.y+16,"#fff",10); saveGame(); }
    }
  });
  const tc=Math.floor((hb.x+hb.w/2)/TILE), tr=Math.floor((hb.y+hb.h/2)/TILE);
  if (tileAt(tc,tr)===T.BRICK){
    room.tiles[tr][tc]=baseFloor(); sfx.hit(); shake(6,3);
    spawnParticles(tc*TILE+16,tr*TILE+16,"#e0a060",10);
    if (Math.random()<0.5){ player.coins++; sfx.coin(); floater("+1¢", tc*TILE+8, tr*TILE, "#ffcc33"); }
    saveGame();
  }
}

function updateEnemies(){
  getRoom().enemies.forEach(en=>{
    if (!en.alive) return;
    if (en.flash>0) en.flash--;
    if (en.cool>0) en.cool--;
    else {
      const nx=en.x+en.dir*1.1;
      const c=Math.floor((nx+(en.dir>0?TILE:0))/TILE), r=Math.floor((en.y+TILE/2)/TILE);
      if (isSolid(c,r)){ en.dir*=-1; en.cool=8; } else en.x=nx;
    }
    if (player.invuln===0 && rects({x:player.x,y:player.y,w:player.w,h:player.h},
                                   {x:en.x+4,y:en.y+4,w:TILE-8,h:TILE-8})) damagePlayer(1);
  });
}
function damagePlayer(n){
  player.hp-=n; player.invuln=60; sfx.hurt(); shake(10,5);
  floater("-"+n+"❤", player.x, player.y-4, "#ff5b5b");
  if (player.hp<=0){ state="gameover"; localStorage.removeItem("triforce-save"); }
}

function firstHealthy(){ return player.party.find(c=>c.hp>0) || player.party[0]; }
function startBattle(){

  if (Math.random()<0.12) idx = 5 + (Math.random()*2|0);   // selten 5-6

  battle={ wild, mine:firstHealthy(),
    log:[`Ein wildes ${wild.name} (Lv.${wild.level})`+(SPECIES[idx].rare?" ✨SELTEN✨":"")+" erscheint!"],
    turn:"player", menu:0, anim:0, over:false, _mv:0, isBoss:false, sub:null };
  state="battle";
}
function enterBoss(){
  fadeT=14;
  player.room="boss"; player.px=7; player.py=12; player.x=7*TILE+3; player.y=12*TILE+3;
  const boss={ spec:-1, name:"Schattenkönig", color:"#7b2ff7", emoji:"👑", type:"rock",
    level:12, maxHp:110, hp:110, atk:12, xp:0, status:null, statusTurns:0,
    moves:[{name:"Schattenklaue",power:12,type:"rock"},{name:"Fluch",power:8,type:"rock",effect:"poison",chance:0.5}] };
  battle={ wild:boss, mine:firstHealthy(),

function startMiniBoss(){

    level:8, maxHp:78, hp:78, atk:9, xp:0, status:null, statusTurns:0,
    moves:[{name:"Felsfaust",power:11,type:"rock"},{name:"Steinregen",power:8,type:"rock",effect:"sleep",chance:0.3}] };
  battle={ wild:golem, mine:firstHealthy(),
    log:["🗿 Der Golem-Wächter erwacht!","Besiege ihn für seinen Schatz!"],
    turn:"player", menu:0, anim:0, over:false, _mv:0, isBoss:true, bossKind:"mini", sub:null };
  state="battle";
}
function blog(s){ battle.log.push(s); if (battle.log.length>3) battle.log.shift(); }

function gainXp(c, amount){
  c.xp+=amount;
  while (c.xp >= c.level*12){
    c.xp-=c.level*12; c.level++; c.maxHp+=4; c.hp=c.maxHp; c.atk+=2;
    sfx.levelup(); blog(`${c.name} steigt auf Level ${c.level}!`);
  }
}

/* Führt einen Angriff aus: Gift/Brand-Tick, Schlaf, Schaden, Statuschance */
function doAttack(atk, def, mv){
  if (atk.status==="poison"||atk.status==="burn"){
    const d=atk.status==="poison"?3:2; atk.hp=Math.max(0,atk.hp-d);
    blog(`${atk.name} nimmt ${d} ${atk.status==="poison"?"Gift":"Brand"}-Schaden.`);
    if (atk.hp<=0) return {attackerFainted:true};
  }
  if (atk.status==="sleep"){
    if (atk.statusTurns>0){ atk.statusTurns--; blog(`${atk.name} schläft tief...`);
      if (atk.statusTurns<=0) atk.status=null; return {slept:true}; }
    atk.status=null;
  }
  const eff=effectiveness(mv.type==="normal"?atk.type:mv.type, def.type);
  let dmg=0;
  if (mv.power>0){ dmg=Math.max(1, Math.round((mv.power + Math.round(atk.atk*0.5) + (Math.random()*3|0))*eff));
    def.hp=Math.max(0,def.hp-dmg); sfx.hit(); }
  blog(`${atk.name}: ${mv.name}`+(mv.power>0?` — ${dmg} Schaden`:"")
       +(eff>1?" (sehr effektiv!)":(eff<1&&mv.power>0?" (kaum Wirkung)":"")));
  if (mv.effect && !def.status && def.hp>0 && Math.random()<(mv.chance||0)){
    def.status=mv.effect; def.statusTurns = mv.effect==="sleep" ? (2+(Math.random()*2|0)) : 0;
    blog(`${def.name} ist jetzt ${ {poison:"vergiftet",burn:"verbrannt",sleep:"eingeschläfert"}[mv.effect] }!`);
  }
  return {dmg};
}
function afterMineFaint(){
  const b=battle;
  const next=player.party.find(c=>c.hp>0 && c!==b.mine);
  if (next){ b.mine=next; blog(`${next.name}, du bist dran!`); b.turn="player"; }
  else endBattle(["Dein Team ist erschöpft!","Du fliehst und verlierst ein Herz."], 0, ()=>damagePlayer(1));
}
function winWild(){
  const b=battle;
  if (b.isBoss){
    if (b.bossKind==="final"){ endBattle(["👑 Der Schattenkönig ist besiegt!","Das Licht kehrt ins Land zurück!"],0,()=>{ state="victory"; sfx.win(); }); return; }
    rooms.ruins.cleared=true;
    player.maxHp++; player.hp=player.maxHp; player.coins+=30; player.balls+=3;
    const gift=makeCreature(5,8); gift.status=null; player.party.push(gift); markCaught(5);
    endBattle(["🗿 Golem-Wächter besiegt! Schatz erhalten:","❤ +1 Herz • ¢ +30 • 3 Fangbälle",`${gift.name} ❄️ tritt deinem Team bei!`], 0);
    return;
  }
  gainXp(b.mine, b.wild.level*6+8);
  endBattle([`Das wilde ${b.wild.name} wurde besiegt!`, `${b.mine.name} erhält EP. +3¢`], 3);
}
function moveAction(){
  const b=battle, moves=b.mine.moves;
  if (b.moveSel===moves.length){ b.sub=null; sfx.select(); return; }   // Zurück
  const mv=moves[b.moveSel]; b.sub=null;
  const res=doAttack(b.mine, b.wild, mv);
  if (res.attackerFainted){ afterMineFaint(); return; }
  if (b.wild.hp<=0){ winWild(); return; }
  b.turn="enemy"; b.anim=22;
}
function playerAction(){
  const b=battle; if (b.turn!=="player"||b.over) return;
  if (b.menu===0){ b.sub="moves"; b.moveSel=0; sfx.select(); }   // → Attacken-Menü
  else if (b.menu===1){                          // FANGEN
    if (b.isBoss){ blog("So etwas lässt sich nicht fangen!"); b.turn="enemy"; b.anim=22; return; }
    if (player.balls<=0){ blog("Keine Fangbälle! Kauf welche im Shop."); return; }
    player.balls--;
    const spec=SPECIES[b.wild.spec];
    const rate=0.30 + (1-b.wild.hp/b.wild.maxHp)*0.6 + (spec&&spec.rare?-0.18:0);
    if (Math.random()<rate){ player.party.push({...b.wild, status:null, statusTurns:0});
      markCaught(b.wild.spec); sfx.catch();
      const done=player.caught.length>=SPECIES.length;
      endBattle([`${b.wild.name} wurde gefangen! 🎉`].concat(done?["★ Du hast ALLE Arten gefangen! ★"]:["Es tritt deinem Team bei."]), 0); }
    else { blog(`Mist! ${b.wild.name} bricht aus...`); b.turn="enemy"; b.anim=22; }
  }
  else if (b.menu===2){                          // TRANK
    if (player.potions<=0){ blog("Keine Tränke vorhanden."); return; }
    player.potions--; const heal=Math.min(b.mine.maxHp-b.mine.hp,20); b.mine.hp+=heal;
    sfx.coin(); blog(`${b.mine.name} wird um ${heal} geheilt.`); b.turn="enemy"; b.anim=22;
  }
  else if (b.menu===3){                          // WECHSELN
    if (player.party.length<=1){ blog("Du hast keine weitere Kreatur."); return; }
    b.sub="team"; b.teamSel=0; sfx.select();
  }
  else if (b.menu===4){                          // FLIEHEN
    if (b.isBoss){ blog("Vor diesem Gegner gibt es kein Entkommen!"); b.turn="enemy"; b.anim=22; return; }
    if (Math.random()<0.7) endBattle(["Du bist entkommen."], 0);
    else { blog("Flucht misslungen!"); b.turn="enemy"; b.anim=22; }
  }
}
function teamSwitchAction(){
  const b=battle, n=player.party.length;
  if (b.teamSel===n){ b.sub=null; sfx.select(); return; }   // "Zurück"
  const pick=player.party[b.teamSel];
  if (pick===b.mine){ b.sub=null; sfx.select(); return; }    // schon aktiv
  if (pick.hp<=0){ blog(`${pick.name} ist kampfunfähig!`); sfx.hurt(); return; }
  b.mine=pick; b.sub=null; blog(`Los, ${pick.name}!`); sfx.select();
  b.turn="enemy"; b.anim=22;                                  // Wechsel kostet den Zug
}
function enemyTurn(){
  const b=battle; shake(6,3);
  const mv=b.wild.moves[Math.random()*b.wild.moves.length|0];
  const res=doAttack(b.wild, b.mine, mv);
  if (res.attackerFainted){ winWild(); return; }   // Gegner starb an Gift/Brand
  if (b.mine.hp<=0){ afterMineFaint(); return; }
  b.turn="player";
}
function endBattle(lines, coins, after){
  battle.over=true; player.coins+=(coins||0);
  showMessage(lines, ()=>{
    player.party.forEach(c=>{ if(c.hp>0) c.hp=Math.min(c.maxHp,c.hp+4); }); // leichte Regen.
    if (after) after();
    battle=null; if (state!=="gameover"&&state!=="victory") state="overworld";
    saveGame();
  });
}
function updateBattle(){
  const b=battle; if(!b||b.over) return;
  if (b.anim>0){ b.anim--; return; }
  if (b.turn==="enemy"){ enemyTurn(); return; }
  if (b.turn==="player"){
    if (b.sub==="team"){
      const n=player.party.length+1;   // +Zurück
      if (keys["arrowup"]||keys["w"]){ if(!b._mv){ b.teamSel=(b.teamSel+n-1)%n; b._mv=1; sfx.select(); } }
      else if (keys["arrowdown"]||keys["s"]){ if(!b._mv){ b.teamSel=(b.teamSel+1)%n; b._mv=1; sfx.select(); } }
      else b._mv=0;
      if (enterEdge||attackEdge) teamSwitchAction();
      return;
    }
    if (b.sub==="moves"){
      const n=b.mine.moves.length+1;   // +Zurück
      if (keys["arrowup"]||keys["w"]){ if(!b._mv){ b.moveSel=(b.moveSel+n-1)%n; b._mv=1; sfx.select(); } }
      else if (keys["arrowdown"]||keys["s"]){ if(!b._mv){ b.moveSel=(b.moveSel+1)%n; b._mv=1; sfx.select(); } }
      else b._mv=0;
      if (enterEdge||attackEdge) moveAction();
      return;
    }
    if (keys["arrowup"]||keys["w"]){ if(!b._mv){ b.menu=(b.menu+4)%5; b._mv=1; sfx.select(); } }
    else if (keys["arrowdown"]||keys["s"]){ if(!b._mv){ b.menu=(b.menu+1)%5; b._mv=1; sfx.select(); } }
    else b._mv=0;
    if (enterEdge||attackEdge) playerAction();
  }
}

const SHOP_ITEMS=[
  { name:"Fangball", price:10, apply:()=>player.balls++ , info:"zum Fangen" },
  { name:"Trank",    price:8,  apply:()=>player.potions++, info:"heilt 20 HP" },
  { name:"Herz-Container", price:30, apply:()=>{ player.maxHp++; player.hp=player.maxHp; }, info:"+1 Max-Herz" },
];
function openShop(){ shop={ sel:0, _mv:0, msg:"Willkommen! Was darf's sein?" }; state="shop"; sfx.select(); }
function updateShop(){
  const items=SHOP_ITEMS.length+1; // +Verlassen
  if (keys["arrowup"]||keys["w"]){ if(!shop._mv){ shop.sel=(shop.sel+items-1)%items; shop._mv=1; sfx.select(); } }
  else if (keys["arrowdown"]||keys["s"]){ if(!shop._mv){ shop.sel=(shop.sel+1)%items; shop._mv=1; sfx.select(); } }
  else shop._mv=0;
  if (enterEdge||attackEdge){
    if (shop.sel===SHOP_ITEMS.length){ state="overworld"; saveGame(); return; }
    const it=SHOP_ITEMS[shop.sel];
    if (player.coins>=it.price){ player.coins-=it.price; it.apply(); sfx.coin(); shop.msg=it.name+" gekauft!"; saveGame(); }
    else { shop.msg="Zu wenig Münzen für "+it.name+"."; sfx.hurt(); }
  }
}

========================================================================= */
function saveGame(){
  try{
    const rs={}; for (const k in rooms) rs[k]={ tiles:rooms[k].tiles, enemies:rooms[k].enemies, cleared:rooms[k].cleared };
    const data={ v:3, room:player.room,
      p:{ px:player.px,py:player.py,dir:player.dir, maxHp:player.maxHp,hp:player.hp,
          coins:player.coins,balls:player.balls,potions:player.potions,shards:player.shards,
          party:player.party, seen:player.seen, caught:player.caught },
      rooms:rs };
    localStorage.setItem("triforce-save", JSON.stringify(data));
    hasSave=true;
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem("triforce-save"); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.rooms) return false;
    buildAllRooms();
    for (const k in d.rooms){ if (rooms[k]){ rooms[k].tiles=d.rooms[k].tiles; rooms[k].enemies=d.rooms[k].enemies;
      if (d.rooms[k].cleared!==undefined) rooms[k].cleared=d.rooms[k].cleared; } }
    Object.assign(player, d.p);
    // Abwärtskompatibilität: fehlende Felder auffüllen
    (player.party||[]).forEach(c=>{ if(!c.moves && SPECIES[c.spec]) c.moves=SPECIES[c.spec].moves;
      if(c.status===undefined) c.status=null; if(c.statusTurns===undefined) c.statusTurns=0; });
    if(!player.seen) player.seen=[]; if(!player.caught) player.caught=[];
    player.room=d.room; player.moving=false; player.mx=0; player.my=0;
    player.attack=0; player.invuln=0; player.walkFrame=0;
    player.x=player.px*TILE+3; player.y=player.py*TILE+3;
    return true;
  }catch(e){ return false; }
}

/* =========================================================================
   RENDER
========================================================================= */
function drawTile(t,x,y){
  switch(t){
    case T.GRASS: ctx.fillStyle="#2f9e44"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#2b8f3d"; ctx.fillRect(x+6,y+10,3,3); ctx.fillRect(x+20,y+22,3,3); break;
    case T.FLOOR: ctx.fillStyle="#3b3f52"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#33374a"; ctx.fillRect(x+4,y+4,10,10); ctx.fillRect(x+18,y+18,10,10); break;
    case T.PATH: ctx.fillStyle="#d9c18f"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#cbb079"; ctx.fillRect(x+5,y+6,4,4); ctx.fillRect(x+20,y+18,4,4); break;
    case T.WALL: ctx.fillStyle="#3a5a40"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#4b6b50"; ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
      ctx.fillStyle="#2f4a35"; ctx.fillRect(x+2,y+15,TILE-4,2); break;
    case T.TREE: ctx.fillStyle="#2f9e44"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#5a3a1a"; ctx.fillRect(x+13,y+18,6,12);
      ctx.fillStyle="#1e7a32"; ctx.beginPath(); ctx.arc(x+16,y+13,11,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#2b8f3d"; ctx.beginPath(); ctx.arc(x+12,y+11,5,0,Math.PI*2); ctx.fill(); break;
    case T.TALL: ctx.fillStyle="#2f9e44"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#1e7a32"; for(let i=0;i<4;i++) ctx.fillRect(x+4+i*7,y+8,4,20);
      ctx.fillStyle="#8be37a"; for(let i=0;i<4;i++) ctx.fillRect(x+4+i*7,y+8,4,6); break;
    case T.WATER: ctx.fillStyle="#3ca0ff"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#7cc4ff"; ctx.fillRect(x+4,y+8,10,2); ctx.fillRect(x+18,y+18,10,2); break;
    case T.BRICK: ctx.fillStyle="#b5651d"; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle="#7a3f10"; ctx.lineWidth=2;
      ctx.strokeRect(x+1,y+1,TILE-2,14); ctx.strokeRect(x+1,y+15,TILE-2,14);
      ctx.beginPath(); ctx.moveTo(x+16,y+1); ctx.lineTo(x+16,y+15);
      ctx.moveTo(x+8,y+15); ctx.lineTo(x+8,y+31); ctx.moveTo(x+24,y+15); ctx.lineTo(x+24,y+31); ctx.stroke(); break;
    case T.COIN: drawTile(T.GRASS,x,y);
      ctx.fillStyle="#ffcc33"; ctx.beginPath(); ctx.arc(x+16,y+16,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#a67c00"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.fillText("¢",x+16,y+20); break;
    case T.CHEST: drawTile(T.FLOOR,x,y);
      ctx.fillStyle="#8a5a2b"; ctx.fillRect(x+5,y+10,22,16);
      ctx.fillStyle="#c98a3b"; ctx.fillRect(x+5,y+10,22,6);
      ctx.fillStyle="#ffcc33"; ctx.fillRect(x+14,y+15,4,6); break;
    case T.SHARD: (player.room==="cave")?drawTile(T.FLOOR,x,y):drawTile(T.GRASS,x,y);
      const g=Math.abs(Math.sin(player.walkFrame*0.1+x));
      ctx.fillStyle="rgba(255,224,102,"+(0.3+g*0.4)+")"; ctx.beginPath(); ctx.arc(x+16,y+16,13,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffe066"; ctx.beginPath(); ctx.moveTo(x+16,y+5); ctx.lineTo(x+27,y+24); ctx.lineTo(x+5,y+24); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#fff7c0"; ctx.beginPath(); ctx.moveTo(x+16,y+11); ctx.lineTo(x+21,y+21); ctx.lineTo(x+11,y+21); ctx.closePath(); ctx.fill(); break;
    case T.SHOP: drawTile(T.GRASS,x,y);
      ctx.fillStyle="#c0392b"; ctx.fillRect(x+3,y+2,TILE-6,8);       // Markise
      ctx.fillStyle="#fff"; for(let i=0;i<3;i++) ctx.fillRect(x+4+i*9,y+2,4,8);
      ctx.fillStyle="#8a5a2b"; ctx.fillRect(x+6,y+12,20,18);         // Körper
      ctx.fillStyle="#ffd9a0"; ctx.fillRect(x+11,y+14,10,8);        // Gesicht
      ctx.fillStyle="#123"; ctx.fillRect(x+13,y+17,2,2); ctx.fillRect(x+18,y+17,2,2); break;
    case T.GATE: drawTile(T.WALL,x,y);
      ctx.fillStyle="#2b2f45"; ctx.fillRect(x+5,y+6,22,24);
      ctx.fillStyle=(player.shards>=3?"#ffe066":"#111"); ctx.beginPath(); ctx.arc(x+16,y+16,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#556"; ctx.fillRect(x+15,y+18,2,8); break;
    case T.SIGN: drawTile(T.GRASS,x,y);
      ctx.fillStyle="#8a5a2b"; ctx.fillRect(x+14,y+16,4,12);
      ctx.fillStyle="#c98a3b"; ctx.fillRect(x+6,y+6,20,12);
      ctx.fillStyle="#5a3a1a"; ctx.fillRect(x+9,y+9,14,2); ctx.fillRect(x+9,y+13,10,2); break;
    case T.HEAL: drawTile(T.GRASS,x,y);
      const gg=0.4+0.4*Math.abs(Math.sin(player.walkFrame*0.08+y));

function drawPlayer(){
  if (player.invuln>0 && (player.invuln>>2)%2===0) return;

function drawOverworld(){
  const room=getRoom();
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) drawTile(room.tiles[r][c], c*TILE, r*TILE);

function update(){
  gtick++; if (fadeT>0) fadeT--;
  floaters.forEach(f=>{ f.life--; f.y-=0.4; }); floaters=floaters.filter(f=>f.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; }); particles=particles.filter(p=>p.life>0);
  if (shakeT>0) shakeT--;

  if (state==="title"){
    const n=hasSave?2:1;
    if (keys["arrowup"]||keys["w"]){ if(!titleMv){ titleSel=(titleSel+n-1)%n; titleMv=1; sfx.select(); } }
    else if (keys["arrowdown"]||keys["s"]){ if(!titleMv){ titleSel=(titleSel+1)%n; titleMv=1; sfx.select(); } }
    else titleMv=0;
    if (enterEdge||attackEdge){
      if (hasSave && titleSel===0){ if(!loadGame()) newGame(); state="overworld"; }
      else newGame();
    }
  }
  else if (state==="starter"){
    if (keys["arrowleft"]){ if(!starterMv){ starterSel=(starterSel+2)%3; starterMv=1; sfx.select(); } }
    else if (keys["arrowright"]){ if(!starterMv){ starterSel=(starterSel+1)%3; starterMv=1; sfx.select(); } }
    else starterMv=0;
    if (enterEdge||attackEdge){ player.party=[makeCreature(STARTERS[starterSel],5)];
      markCaught(STARTERS[starterSel]); sfx.levelup(); saveGame();
      showMessage(["Deine Reise beginnt im Dorf.","Sprich mit Leuten (Enter/B), kämpfe im Gras,","finde die 3 Splitter und öffne das Tor zum Boss.","Tipp: P = Pokédex • M = Musik • Ruinen im Osten!"],
        ()=>{ state="overworld"; }); }
  }
  else if (state==="overworld") updateOverworld();
  else if (state==="battle") updateBattle();
  else if (state==="shop") updateShop();
  else if (state==="pokedex"){ if (enterEdge||attackEdge||pEdge){ state="overworld"; sfx.select(); } }
  else if (state==="message"){ if (enterEdge||attackEdge){ const a=message.after; message=null;
    state=(battle&&!battle.over)?"battle":( state==="message"?"overworld":state );
    if (a) a(); } }
  else if (state==="gameover"){ if (enterEdge||attackEdge){ titleSel=0; hasSave=!!localStorage.getItem("triforce-save"); state="title"; } }
  else if (state==="victory"){ if (enterEdge||attackEdge){ localStorage.removeItem("triforce-save"); hasSave=false; titleSel=0; state="title"; } }

  enterEdge=false; attackEdge=false; pEdge=false;
}
let titleMv=0, starterSel=0, starterMv=0;

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  if (shakeT>0){ ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag); }
  if (state==="title") drawTitle();
  else if (state==="starter") drawStarter();
  else if (state==="battle") drawBattle();
  else if (state==="shop") drawShop();
  else if (state==="message") drawMessage();
  else if (state==="gameover") drawGameOver();
  else if (state==="victory") drawVictory();
  else if (state==="pokedex") drawDex();
  else drawOverworld();
  if (fadeT>0){ ctx.fillStyle="rgba(0,0,0,"+(fadeT/14)+")"; ctx.fillRect(-8,-8,cv.width+16,cv.height+16); }
  ctx.restore();
}
function loop(){ update(); render(); requestAnimationFrame(loop); }

/* Init */
buildAllRooms();
hasSave = !!localStorage.getItem("triforce-save");
titleSel = 0;
loop();
</script>
